# Workout calendar data.
#
# Day statuses: "done", "rest", "missed", "future".
# A "done" day also carries a "type" matching one of the [[type]] ids below.

[stats]
day_streak = 1
week_streak = 1
longest_streak = 1
completed = 1
scheduled_days = 100

# Categories. Each needs an id, a label for the legend, and a color.
# Colors are theme CSS variables so they follow light and dark mode on their own.
# Adding a category here is all that is needed, the legend and the grid pick it up.

[[type]]
id = "run"
label = "Run"
color = "var(--callout-tip-color)"

# Uncomment a block as you start logging that category.
#
[[type]]
id = "walk"
label = "Walk"
color = "var(--callout-warning-color)"
#
[[type]]
id = "hiit"
label = "HIIT"
color = "var(--callout-caution-color)"
#
# [[type]]
# id = "strength"
# label = "Strength training"
# color = "var(--primary-color)"

[[month]]
label = "Sep 2026"

[[month.day]]
date = "2026-09-17"
status = "done"
type = ["walk"]

[[month.day]]
date = "2026-09-18"
status = "done"
type = ["walk"]

[[month.day]]
date = "2026-09-19"
status = "done"
type = ["walk"]

# Add one block per day, in date order. Examples of each shape:
#
# [[month.day]]
# date = "2026-09-19"
# status = "done"
# type = "walk"
#
# Two or more sessions on one day: give "type" a list. The square is split
# between the category colors, in the order listed.
#
# [[month.day]]
# date = "2026-09-19"
# status = "done"
# type = ["run", "strength"]
#
# [[month.day]]
# date = "2026-09-20"
# status = "rest"
#
# [[month.day]]
# date = "2026-09-21"
# status = "missed"
#
# [[month.day]]
# date = "2026-09-22"
# status = "future"
#
# Each new month opens its own block, then its days follow:
#
# [[month]]
# label = "Oct 2026"
#
# [[month.day]]
# date = "2026-10-01"
# status = "done"
# type = "run"
